/* ===== QR Generator & Download ===== */
function drawPassQr(token){
 setTimeout(()=>{
  const c=$('#pass-qr-canvas');if(!c)return;
  const payload=token||'RG-DEMO-PASS';
  if(window.QRCode&&window.QRCode.toCanvas){
   window.QRCode.toCanvas(c,payload,{
    width:200,
    margin:2,
    errorCorrectionLevel:'H',
    color:{dark:'#0b192c',light:'#ffffff'}
   },err=>{if(err)console.warn('QR Canvas error:',err)});
  }else{
   const img=new Image();img.crossOrigin='anonymous';
   img.src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(payload)}`;
   img.onload=()=>{
    const ctx=c.getContext('2d');c.width=200;c.height=200;ctx.drawImage(img,0,0);
   };
  }
 },60);
}

/* ===== URL Check-in Token Handler ===== */
(async function handleInvitationToken(){
 const hashMatch=location.hash.match(/[#&?]t=([a-f0-9]{64})/i);
 const searchMatch=location.search.match(/[?&]t=([a-f0-9]{64})/i);
 const token=(hashMatch&&hashMatch[1])||(searchMatch&&searchMatch[1]);
 if(token){
  try{
   const res=await fetch('/api/checkin/lookup',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token})
   });
   const data=await res.json();
   if(data?.data){
    const g=data.data;
    const me={
     n:g.name,
     a:g.checked_in?'Sudah Masuk / Hadir':'Hadir Bersama',
     p:g.pax,
     token:token,
     id:'RG-'+token.slice(0,6).toUpperCase(),
     t:Date.now()
    };
    SV('me',me);
    if(g.name){
     window.invitedGuestName=g.name;
     const el=$('#welcome-guest-name');
     if(el)el.textContent=g.name;
     const gn=$('#gn');
     if(gn&&!gn.value)gn.value=g.name;
    }
   }
  }catch(e){console.warn('Token lookup:',e)}
 }
})();

/* ===== welcome page & open invitation ===== */
(function setupWelcome(){
 const welcome=$('#welcome');
 const btnOpen=$('#btn-open-invite');
 const btnReopen=$('#btn-reopen-welcome');

 function getGuestName(){
  const sp=new URLSearchParams(window.location.search);
  const toParam=sp.get('to');
  if(toParam&&toParam.trim())return toParam.trim();
  const hashMatch=window.location.hash.match(/[#&?]to=([^&]+)/i);
  if(hashMatch&&hashMatch[1]){
   try{return decodeURIComponent(hashMatch[1].replace(/\+/g,' ')).trim();}catch{}
  }
  return null;
 }

 const gName=getGuestName();
 if(gName){
  window.invitedGuestName=gName;
  const el=$('#welcome-guest-name');
  if(el)el.textContent=gName;
  const gn=$('#gn');
  if(gn&&!gn.value)gn.value=gName;
 }

 function openInvitation(){
  if(a&&a.paused){
   started=1;
   a.play().catch(()=>{});
   icon();
  }
  if(welcome){
   welcome.classList.add('opacity-0','pointer-events-none','scale-105');
   setTimeout(()=>{welcome.style.display='none';},700);
  }
  if(window.spawnHeart){
   window.spawnHeart(30);
   setTimeout(()=>window.spawnHeart(70),250);
   setTimeout(()=>window.spawnHeart(50),500);
  }
 }

 function reopenCover(){
  if(welcome){
   welcome.style.display='flex';
   welcome.offsetHeight;
   welcome.classList.remove('opacity-0','pointer-events-none','scale-105');
  }
 }

 if(btnOpen)btnOpen.addEventListener('click',openInvitation);
 if(btnReopen)btnReopen.addEventListener('click',reopenCover);
 window.openInvitation=openInvitation;
 window.reopenCover=reopenCover;
})();

/* ===== floating hearts animation ===== */
(function setupFloatingHearts(){
 const layer=$('#hearts-layer');
 if(!layer)return;
 const hearts=['♥','❤','💖','💕','💗'];
 const colors=['#f43f5e','#e11d48','#ec4899','#d4af37','#2563eb','#fb7185'];

 function spawn(xPct=null){
  if(layer.children.length>=12)return;
  const h=document.createElement('span');
  const size=Math.floor(Math.random()*12)+16;
  const left=xPct??(Math.random()*82+9);
  const dur=(Math.random()*2.2+4.2).toFixed(1);
  const sway=(Math.random()*40-20).toFixed(0);
  const rot=(Math.random()*44-22).toFixed(0);
  const col=colors[Math.floor(Math.random()*colors.length)];
  const sym=hearts[Math.floor(Math.random()*hearts.length)];

  h.className='floating-heart';
  h.textContent=sym;
  h.style.cssText=`left:${left}%;font-size:${size}px;color:${col};filter:drop-shadow(0 2px 8px rgba(0,0,0,0.18));animation-duration:${dur}s;--sway:${sway}px;--rot:${rot}deg;`;
  h.addEventListener('animationend',()=>h.remove(),{once:true});
  layer.appendChild(h);
 }

 setInterval(()=>{
  if(document.visibilityState==='visible')spawn();
 },1600);

 spawn(20);
 setTimeout(()=>spawn(50),300);
 setTimeout(()=>spawn(78),700);
 window.spawnHeart=spawn;
})();
